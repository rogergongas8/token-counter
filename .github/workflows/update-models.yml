name: Update model prices

on:
  schedule:
    - cron: '17 4 * * *'   # every day at 04:17 UTC
  workflow_dispatch: {}     # lets you run it by hand from the Actions tab

permissions:
  contents: write

concurrency:
  group: update-models
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Regenerate catalog and price pages
        run: node scripts/update-models.mjs
      - name: Commit if something changed
        run: |
          # the script writes nothing when models and prices are unchanged
          if [ -z "$(git status --porcelain -- data prices sitemap.xml)" ]; then
            echo "No changes."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data prices sitemap.xml
          git commit -m "Update model prices"
          git push
